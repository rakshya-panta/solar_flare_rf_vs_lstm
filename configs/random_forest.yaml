# Random Forest settings used for training
params:
  n_estimators: 300
  min_samples_leaf: 5
  max_depth: null
  pos_weight: full_weight
# Bayesian hyperparameter tuning
wandb_project: data-mining-project-sf
sweep:
  method: bayes
  metric: {name: val_CSS, goal: maximize}
  parameters:
    n_estimators: {values: [50, 100, 150, 200, 250, 300, 350, 400, 450, 500]}
    min_samples_leaf: {distribution: q_log_uniform_values, min: 1, max: 50, q: 1}
    max_depth: {values: [10, 20, 30, 40, 50, null]}  # null = no limit
    pos_weight: {distribution: log_uniform_values, min: 1, max: full_weight}
